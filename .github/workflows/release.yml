name: release

# Cut a release by pushing a semver tag:  git tag v0.1.0 && git push origin v0.1.0
# Builds static, cross-platform binaries (pure Go, CGO off) and attaches them to
# a GitHub Release so users without a Go toolchain can curl-and-run.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Test
        run: go test ./...
      - name: Build cross-platform binaries
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${V}" -o scan ./cmd/scan
            # Unversioned archive names so releases/latest/download/<name> is a
            # stable URL (the version is embedded in the binary via --version).
            tar -czf "dist/scan_${os}_${arch}.tar.gz" scan README.md LICENSE
            rm -f scan
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
