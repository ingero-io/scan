# board-compose.yaml - stand up Prometheus + Grafana scraping a running
# `scan --prometheus :9100` and auto-load the MFU-gap board.
#
#   1. on the GPU host, run the exporter:
#        scan --endpoint http://localhost:8000/metrics --model qwen2-7b \
#             --rate 1.10 --prometheus :9100
#   2. then:  docker compose -f board-compose.yaml up
#   3. open http://localhost:3000  (anonymous, the board loads itself)
#
# scan runs on the host (it needs nvidia-smi + the engine), so Prometheus
# reaches it via host.docker.internal. On Linux that name is mapped through
# the extra_hosts entry below.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: scan-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./provisioning/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: scan-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./provisioning/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./scan-board.json:/var/lib/grafana/dashboards/scan-board.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
